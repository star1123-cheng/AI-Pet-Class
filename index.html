<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>我的 AI 寵物</title>
<style>
  :root {
    --bg: #f6f4ef;
    --panel: #ffffff;
    --ink: #222222;
    --muted: #666055;
    --line: #ddd6c8;
    --accent: #2f6fd0;
    --accent-ink: #ffffff;
    --good: #2e8b57;
    --warn: #c0392b;
    --note: #fff4cc;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100dvh;
    overflow: hidden;
    overscroll-behavior: none;
    background: var(--bg);
    color: var(--ink);
    font: 18px/1.5 -apple-system, "PingFang TC", "Noto Sans TC", sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation; /* 取消雙擊放大 */
  }
  [hidden] { display: none !important; }
  .screen {
    height: 100dvh;
    padding: max(16px, env(safe-area-inset-top)) 20px max(16px, env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }
  h1 { font-size: 30px; margin: 0; }
  p { margin: 0; }
  .muted { color: var(--muted); }
  button {
    min-height: 56px;
    min-width: 56px;
    padding: 0 28px;
    font: inherit;
    font-size: 22px;
    border-radius: 14px;
    border: 2px solid var(--line);
    background: #fff;
    color: var(--ink);
  }
  button:active { transform: scale(0.97); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
  button:disabled { opacity: 0.5; }
  button.small { min-height: 48px; font-size: 18px; padding: 0 16px; }

  /* 領養 */
  #serial {
    width: min(420px, 90vw);
    height: 76px;
    font: 700 40px/1 ui-monospace, Menlo, monospace;
    letter-spacing: 0.3em;
    text-align: center;
    text-transform: uppercase;
    border: 3px solid var(--line);
    border-radius: 16px;
    background: #fff;
    color: var(--ink);
    -webkit-user-select: text;
    user-select: text;
  }
  #serial:focus { outline: none; border-color: var(--accent); }
  .error { color: var(--warn); min-height: 1.5em; font-weight: 600; text-align: center; }
  .rule { background: var(--note); border-radius: 12px; padding: 10px 16px; max-width: 520px; text-align: center; }

  /* 寵物 */
  .pet-screen { justify-content: flex-start; }
  .top { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .serial-tag { font: 700 20px ui-monospace, Menlo, monospace; letter-spacing: 0.15em; color: var(--muted); }
  .stage { display: flex; flex-wrap: wrap; gap: 24px; align-items: center; align-content: center; justify-content: center; flex: 1; width: 100%; }
  .pet { width: min(340px, 70vw, 40dvh); aspect-ratio: 1; animation: pop 0.6s ease-out both, bob 3s 0.6s ease-in-out infinite; }
  .pet svg { width: 100%; height: 100%; }
  @keyframes pop { 0% { transform: scale(0.2); opacity: 0; } 70% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); } }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  /* 搖尾巴、眨眼：transform-box 讓旋轉中心以尾巴或眼睛本身為準 */
  .pet .pet-tail { transform-box: fill-box; transform-origin: 0% 100%; animation: wag 1.6s ease-in-out infinite; }
  .pet .pet-eyes { transform-box: fill-box; transform-origin: center; animation: blink 4.5s infinite; }
  @keyframes wag { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-8deg); } }
  @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(0.1); } }
  /* AI 核心：準確率越高越亮，全亮時閃得快一點 */
  .pet .pet-core { animation: glow 2.4s ease-in-out infinite; }
  .pet .pet-core-3 { animation-duration: 1.4s; }
  @keyframes glow { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
  @media (prefers-reduced-motion: reduce) { .pet, .pet .pet-tail, .pet .pet-eyes, .pet .pet-core { animation: none; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px 20px; width: min(420px, 90vw); }
  .panel h2 { font-size: 20px; margin: 0 0 10px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat { background: var(--bg); border-radius: 12px; padding: 10px 12px; }
  .stat .k { color: var(--muted); }
  .stat .v { font-size: 28px; font-weight: 700; }
  .hint { margin-top: 10px; color: var(--muted); }
  .sync { color: var(--muted); text-align: center; min-height: 1.5em; }
  .banner { background: #fde2df; color: var(--warn); border-radius: 12px; padding: 10px 16px; font-weight: 600; text-align: center; }
</style>
</head>
<body>
  <main id="adopt" class="screen" hidden>
    <h1>領養你的 AI 寵物</h1>
    <p class="muted">輸入序號卡上的 6 個字</p>
    <input id="serial" maxlength="8" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" enterkeyhint="go" aria-label="序號">
    <p id="adoptError" class="error" role="alert"></p>
    <button id="adoptBtn" class="primary">領養</button>
    <p class="rule">守則 1：不要在遊戲裡輸入真實姓名、學校、電話、住址</p>
  </main>

  <main id="home" class="screen pet-screen" hidden>
    <div class="top">
      <span id="serialTag" class="serial-tag"></span>
      <button id="switchBtn" class="small">換人</button>
    </div>
    <p id="rejected" class="banner" hidden>這個序號不在老師的名單上，請拿序號卡問老師</p>
    <div class="stage">
      <div id="pet" class="pet"></div>
      <section class="panel" aria-label="AI 狀態">
        <h2>我的 AI 狀態</h2>
        <div class="stats">
          <div class="stat"><div class="k">資料量</div><div id="sData" class="v"></div></div>
          <div class="stat"><div class="k">資料品質</div><div id="sQuality" class="v"></div></div>
          <div class="stat"><div class="k">訓練次數</div><div id="sTrain" class="v"></div></div>
          <div class="stat"><div class="k">準確率</div><div id="sAcc" class="v"></div></div>
        </div>
        <p class="hint">牠現在什麼都不會。你餵給牠的範例，會決定牠變得多厲害。</p>
        <p class="hint">看牠胸前的 AI 核心：準確率越高，就越亮。</p>
      </section>
    </div>
    <p id="sync" class="sync" aria-live="polite"></p>
  </main>
<script type="module" src="app/main.js"></script>
</body>
</html>
