<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>AI 猜猜畫畫</title>
<!--
  AI 猜猜畫畫：抽一個題目，用手指畫，AI 寵物用自己的「腦袋」（訓練過的範例）猜你畫什麼。
  可以改：主題色（:root 的顏色）、題目數、規則、文字、外觀。
  請保留：ENGINE 區塊（AI 寵物怎麼猜）、DATA 區塊（寵物外型與腦袋）、每個 SKILL 區塊的開頭與結尾標記。
  單一 HTML 檔，不載入任何外部圖片、字型或程式。
-->
<style>
  :root {
    --table: #eef1f8;  /* 背景 */
    --ink: #1e2140;    /* 字與框線 */
    --ink-2: #474d75;
    --line: #c9d0e3;
    --panel: #ffffff;
    --paper: #fffbea;  /* 卡面 */
    --gold: #ffd23f;   /* 寵物卡框 */
    --blue: #2f6beb;   /* 主要按鈕 */
    --blue-deep: #1f4fc0;
    --good: #167a4b;
    --good-soft: #e0f4e9;
    --bad: #c8323c;
    --bad-soft: #fde4e5;
    --holo: conic-gradient(from 200deg, #ff7eb6, #ffd23f, #7dffb0, #6ec8ff, #b18cff, #ff7eb6);
    --round: ui-rounded, "SF Pro Rounded", "PingFang TC", "Noto Sans TC", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100dvh;
    background: var(--table);
    color: var(--ink);
    font: 500 18px/1.55 -apple-system, "PingFang TC", "Noto Sans TC", sans-serif;
    font-variant-numeric: tabular-nums;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  [hidden] { display: none !important; }
  h1, h2, p { margin: 0; }
  h1, h2, .question { font-family: var(--round); font-weight: 800; }
  .app { max-width: 1000px; margin: 0 auto; padding: max(14px, env(safe-area-inset-top)) 20px 20px; display: flex; flex-direction: column; gap: 14px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 28px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { background: var(--panel); border: 2px solid var(--ink); border-radius: 999px; padding: 4px 14px; font: 800 20px/1.3 var(--round); display: inline-flex; gap: 8px; align-items: baseline; }
  .chip small { font: 700 16px/1 var(--round); color: var(--ink-2); }
  .stage { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; align-items: start; }
  @media (max-width: 820px) { .stage { grid-template-columns: 1fr; } .pets { flex-direction: row; } }
  .board { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .question { font-size: 26px; }
  .question b { display: inline-block; min-width: 2.5em; padding: 0 12px; margin-left: 6px; border: 3px solid var(--ink); border-radius: 12px; background: var(--paper); text-align: center; }
  .pad-frame { width: min(100%, 460px, 58dvh); aspect-ratio: 1; background: var(--gold); border-radius: 22px; padding: 10px; box-shadow: 0 4px 10px rgba(30, 33, 64, 0.12), 0 18px 40px rgba(30, 33, 64, 0.16); }
  #pad { width: 100%; height: 100%; display: block; background: var(--panel); border: 3px solid var(--ink); border-radius: 14px; touch-action: none; cursor: crosshair; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  button { min-height: 56px; min-width: 56px; padding: 0 24px; font: 700 21px/1.2 var(--round); border-radius: 14px; border: 2.5px solid var(--ink); background: var(--panel); color: var(--ink); }
  button:active { transform: translateY(2px) scale(0.98); }
  button:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
  button.primary { background: var(--blue); border-color: var(--blue-deep); color: #fff; font-weight: 800; box-shadow: 0 3px 8px rgba(47, 107, 235, 0.35); }
  .pets { display: flex; flex-direction: column; gap: 14px; }
  .pet-card { flex: 1; background: var(--gold); border-radius: 22px; padding: 9px; box-shadow: 0 2px 4px rgba(30, 33, 64, 0.08), 0 8px 20px rgba(30, 33, 64, 0.1); }
  .pet-face { background: var(--paper); border: 2.5px solid var(--ink); border-radius: 15px; padding: 8px 12px 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
  .pet-art { width: 130px; height: 130px; }
  .pet-art svg { width: 100%; height: 100%; }
  .pet-name { font: 800 19px/1.2 var(--round); }
  .bubble { position: relative; width: 100%; min-height: 2.4em; background: var(--panel); border: 2px solid var(--ink); border-radius: 14px; padding: 6px 10px; font: 700 20px/1.35 var(--round); }
  .bubble small { display: block; font: 600 17px/1.3 var(--round); color: var(--ink-2); }
  .say { font: 700 18px/1.35 var(--round); color: var(--blue-deep); min-height: 1.35em; }
  .result { text-align: center; font: 800 24px/1.3 var(--round); min-height: 1.3em; }
  .result.ok { color: var(--good); }
  .result.no { color: var(--bad); }
  .toast { position: fixed; left: 50%; top: 18px; transform: translateX(-50%); background: var(--ink); color: #fff; border-radius: 999px; padding: 8px 20px; font: 800 20px/1.3 var(--round); }
  .overlay { position: fixed; inset: 0; background: rgba(30, 33, 64, 0.45); display: grid; place-items: center; padding: 20px; }
  .sheet { width: min(520px, 100%); background: var(--paper); border: 3px solid var(--ink); border-radius: 22px; padding: 24px; display: flex; flex-direction: column; gap: 14px; align-items: center; text-align: center; }
  .sheet.holo { border: 8px solid transparent; background: linear-gradient(var(--paper), var(--paper)) padding-box, var(--holo) border-box; }
  .sheet h2 { font-size: 28px; }
  .sheet p { white-space: pre-line; }
  .jump { animation: jump 0.5s ease-out; }
  .shake { animation: shake 0.5s ease-in-out; }
  @keyframes jump { 40% { transform: translateY(-22px); } }
  @keyframes shake { 25% { transform: rotate(-8deg); } 75% { transform: rotate(8deg); } }
  @media (prefers-reduced-motion: reduce) { .jump, .shake { animation: none; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>AI 猜猜畫畫</h1>
    <div id="chips" class="chips"></div>
  </header>
  <main class="stage">
    <section class="board">
      <p class="question">請畫：<b id="target">？</b></p>
      <div class="pad-frame"><canvas id="pad" width="640" height="640" aria-label="畫畫區，用手指畫"></canvas></div>
      <div class="row">
        <button id="clear">重畫</button>
        <button id="go" class="primary">畫好了，讓 AI 猜</button>
        <button id="next" class="primary" hidden>下一題</button>
      </div>
      <p id="result" class="result" role="status"></p>
    </section>
    <aside id="pets" class="pets"></aside>
  </main>
</div>
<div id="toast" class="toast" hidden></div>
<div id="overlay" class="overlay" hidden>
  <div id="sheet" class="sheet" role="dialog" aria-modal="true">
    <h2 id="sheet-title"></h2>
    <p id="sheet-text"></p>
    <button id="sheet-btn" class="primary"></button>
  </div>
</div>

  init: function (ctx) {
    var names = ['簡單', '普通', '困難'], chip = ctx.ui.chip('難度'), win = 0, lose = 0;
    function show() { chip.set(names[ctx.state.strict]); }
    ctx.onStart(function () { win = 0; lose = 0; ctx.state.strict = 0; show(); });
    ctx.onGuess(function (r) {
      if (r.correct) { win++; lose = 0; } else { lose++; win = 0; }
      if (win >= 3 && ctx.state.strict < 2) { ctx.state.strict++; win = 0; ctx.ui.toast('變難了！'); }
      if (lose >= 2 && ctx.state.strict > 0) { ctx.state.strict--; lose = 0; ctx.ui.toast('變簡單一點'); }
      show();
    });
  }
};
/* === END:adapt === */

/* === GAME === */
// 遊戲流程：開始 → 每題抽題目 → 畫 → AI 猜 → 下一題 → 結束。作品道具用 ctx 掛上自己的功能。
(function () {
  var ROUNDS = 5;                 // 一局幾題
  var STRICT = [0, 0.6, 0.85];    // 難度：AI 至少要多確定才算猜對
  var ORDER = ['圓', '方', '三角', '叉叉'];
  var $ = function (id) { return document.getElementById(id); };
  var pad = $('pad'), pen = pad.getContext('2d'), strokes = [], drawing = null;
  var hooks = { start: [], round: [], guess: [], end: [] };
  var state = { round: 0, total: ROUNDS, correct: 0, streak: 0, classes: [], strict: 0, target: null, playing: false, notes: [] };

  var pets = PET_DATA.pets.slice(0, 2).map(function (p, i) {
    var card = el('div', 'pet-card'), face = el('div', 'pet-face'), art = el('div', 'pet-art');
    var name = el('p', 'pet-name', p.name || 'AI 寵物'), bubble = el('div', 'bubble'), say = el('p', 'say');
    art.innerHTML = p.svg || ''; // 寵物外型是遊戲產生的 SVG，不是使用者輸入
    face.append(art, name, bubble, say);
    card.append(face);
    $('pets').append(card);
    var samples = p.brain ? decodeBrain(p.brain) : [];
    return { card: card, art: art, bubble: bubble, sayEl: say, phrase: p.phrase || '', samples: samples.length ? samples : demoSamples() };
  });
  var allClasses = ORDER.filter(function (l) { return pets.some(function (p) { return p.samples.some(function (s) { return s.label === l; }); }); });

  function el(tag, cls, text) { var e = document.createElement(tag); e.className = cls; if (text) e.textContent = text; return e; }
  function emit(name, arg) { hooks[name].forEach(function (fn) { try { fn(arg); } catch (e) { console.error(e); } }); }

  var ui = {
    pets: pets,
    chip: function (label) {
      var c = el('span', 'chip'), small = el('small', '', label), b = el('b', '', '');
      c.append(small, b);
      $('chips').append(c);
      return { el: c, set: function (v) { b.textContent = v; } };
    },
    say: function (i, text) { if (pets[i]) pets[i].sayEl.textContent = text; },
    toast: function (text) {
      var t = $('toast');
      t.textContent = text; t.hidden = false;
      clearTimeout(ui.toastId);
      ui.toastId = setTimeout(function () { t.hidden = true; }, 1600);
    },
    popup: function (title, text, button, onClose, kind) {
      $('sheet-title').textContent = title;
      $('sheet-text').textContent = text;
      $('sheet-btn').textContent = button;
      $('sheet').className = 'sheet' + (kind ? ' ' + kind : '');
      $('overlay').hidden = false;
      $('sheet-btn').onclick = function () { $('overlay').hidden = true; if (onClose) onClose(); };
    }
  };

  var ctx = {
    state: state, ui: ui, end: end,
    onStart: function (fn) { hooks.start.push(fn); },
    onRound: function (fn) { hooks.round.push(fn); },
    onGuess: function (fn) { hooks.guess.push(fn); },
    onEnd: function (fn) { hooks.end.push(fn); }
  };
  Object.keys(window.PetSkills).forEach(function (id) {
    try { window.PetSkills[id].init(ctx); } catch (e) { console.error('作品道具 ' + id + ' 有問題', e); }
  });

  function start() {
    state.round = 0; state.correct = 0; state.streak = 0; state.strict = 0;
    state.total = ROUNDS; state.classes = allClasses.slice(); state.notes = []; state.playing = true;
    emit('start', state);
    nextRound();
  }

  function nextRound() {
    if (state.round >= state.total) return end();
    state.round++;
    var choices = state.classes.filter(function (l) { return l !== state.target; });
    if (!choices.length) choices = state.classes;
    state.target = choices[Math.floor(Math.random() * choices.length)];
    $('target').textContent = state.target;
    $('result').textContent = '第 ' + state.round + '／' + state.total + ' 題，畫好按「讓 AI 猜」';
    $('result').className = 'result';
    pets.forEach(function (p) { p.bubble.textContent = '我在看你畫…'; p.sayEl.textContent = ''; });
    clearPad();
    $('go').hidden = false; $('next').hidden = true;
    emit('round', state);
  }

  function guess(lines) {
    if (!state.playing || $('go').hidden) return null;
    var q = features(lines);
    if (isBlank(q.grid)) { $('result').textContent = '先畫一個「' + state.target + '」喔'; return null; }
    var guesses = pets.map(function (p, i) {
      var g = classify(q, p.samples.filter(function (s) { return state.classes.indexOf(s.label) >= 0; }));
      p.bubble.textContent = '';
      p.bubble.append(document.createTextNode('我猜是「' + g.label + '」'), el('small', '', '跟範例像 ' + Math.round(g.similarity * 100) + '%'));
      return { pet: i, label: g.label, confidence: g.confidence, similarity: g.similarity };
    });
    var correct = guesses.some(function (g) { return g.label === state.target && g.confidence >= STRICT[state.strict]; });
    if (correct) { state.correct++; state.streak++; } else state.streak = 0;
    $('result').textContent = correct ? '✓ 認出來了！' : '✗ 沒認出來，畫標準一點再試試';
    $('result').className = 'result ' + (correct ? 'ok' : 'no');
    $('go').hidden = true; $('next').hidden = false;
    $('next').textContent = state.round >= state.total ? '看結果' : '下一題';
    var result = { target: state.target, correct: correct, guesses: guesses };
    emit('guess', result);
    return result;
  }

  function end() {
    if (!state.playing) return;
    state.playing = false;
    emit('end', state);
    var text = ['答對 ' + state.correct + '／' + state.round + ' 題'].concat(state.notes).join('\n');
    ui.popup('這局結束', text, '再玩一次', start);
  }

  // ── 手指畫圖：座標一律換算成 320×320 ──
  function point(e) {
    var r = pad.getBoundingClientRect();
    return { x: Math.min(SIZE, Math.max(0, (e.clientX - r.left) / r.width * SIZE)), y: Math.min(SIZE, Math.max(0, (e.clientY - r.top) / r.height * SIZE)) };
  }
  function line(a, b) {
    var k = pad.width / SIZE;
    pen.lineWidth = LINE * k; pen.lineCap = 'round'; pen.lineJoin = 'round'; pen.strokeStyle = '#1e2140';
    pen.beginPath(); pen.moveTo(a.x * k, a.y * k); pen.lineTo(b.x * k, b.y * k); pen.stroke();
  }
  function clearPad() { strokes = []; drawing = null; pen.clearRect(0, 0, pad.width, pad.height); }
  pad.addEventListener('pointerdown', function (e) {
    if (drawing || $('go').hidden) return;
    e.preventDefault();
    var p = point(e);
    drawing = { id: e.pointerId, pts: [p] };
    strokes.push(drawing.pts);
    try { pad.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
    line(p, p);
  });
  pad.addEventListener('pointermove', function (e) {
    if (!drawing || drawing.id !== e.pointerId) return;
    e.preventDefault();
    var p = point(e), last = drawing.pts[drawing.pts.length - 1];
    if (Math.hypot(p.x - last.x, p.y - last.y) < 1.5) return;
    drawing.pts.push(p);
    line(last, p);
  });
  function lift(e) { if (drawing && drawing.id === e.pointerId) drawing = null; }
  pad.addEventListener('pointerup', lift);
  pad.addEventListener('pointercancel', lift);
  pad.addEventListener('touchstart', function (e) { e.preventDefault(); }, { passive: false });
  pad.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });

  $('clear').onclick = function () { if (!$('go').hidden) clearPad(); };
  $('go').onclick = function () { guess(strokes); };
  $('next').onclick = nextRound;

  window.Game = { state: state, start: start, guess: guess, next: nextRound, end: end, pets: pets };
  start();
})();
/* === END:GAME === */
</script>
</body>
</html>
